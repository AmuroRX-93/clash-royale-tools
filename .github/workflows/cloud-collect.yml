name: Collect Clash Royale history
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: royale-cloud-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: cloud
      - run: node scripts/collect.mjs
        working-directory: cloud
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CR_API_BASE: https://proxy.royaleapi.dev/v1
