name: Collect Clash Royale history
on:
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: royale-cloud-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17,47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: cloud
      - run: node scripts/collect.mjs
        working-directory: cloud
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CR_API_BASE: https://proxy.royaleapi.dev/v1
  daily-check-in:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record daily activity
        run: |
          date -u '+%Y-%m-%d' > .github/collector-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/collector-heartbeat.txt
          if ! git diff --cached --quiet; then
            git commit -m "Daily collector check-in"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
